name: OSRS Coordinate Preview
description: Render OSRS coordinate previews in CI and optionally comment on pull requests.
inputs:
  coordinates:
    description: JSON array of objects containing coordinate, plus optional id, label, and source fields.
    required: true
  comment:
    description: Post or update a pull request comment summarizing the rendered previews.
    required: false
    default: "false"
  renderer-url:
    description: Full URL of the remote render endpoint.
    required: false
    default: https://tiles.collisionlab.world/previews/v1/render
  github-token:
    description: GitHub token used for optional pull request commenting.
    required: false
  output-dir:
    description: Directory where previews and manifest are written.
    required: false
    default: .osrs-coordinate-preview
outputs:
  manifest_path:
    description: Path to the generated manifest.json file.
  render_count:
    description: Number of successfully rendered previews.
  failed_count:
    description: Number of failed preview renders.
runs:
  using: node24
  main: action-dist/main.cjs
