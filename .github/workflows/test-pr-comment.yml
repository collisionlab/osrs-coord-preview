name: Test PR Comment

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

jobs:
  comment-test:
    if: contains(github.event.pull_request.labels.*.name, 'test-pr-comment')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build action and Worker
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Run action with PR comment enabled
        uses: ./
        with:
          coordinates: >-
            [{"coordinate":"2701/3408/0","label":"Test coordinate","source":"label:test-pr-comment:1"},{"coordinate":"3222/3218/0","label":"Lumbridge gate","source":"label:test-pr-comment:2"},{"coordinate":"2701/3408/3","label":"Upper plane","source":"label:test-pr-comment:3"}]
          comment: "true"
          renderer-url: https://tiles.collisionlab.world/previews/v1/render
          github-token: ${{ github.token }}
