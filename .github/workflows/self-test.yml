name: ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c npm ci
      - run: nix develop -c npm run build
      - run: nix develop -c npm test
      - name: Check committed executable Action
        run: git diff --exit-code -- action-dist
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
  release:
    needs: test
    if: github.event_name == 'push' && github.repository_owner == 'collisionlab'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c npm ci
      - run: nix develop -c npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/collisionlab/osrs-coord-preview:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: coordinate-preview-worker
          path: worker-dist/worker.js
      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: collisionlab
          repositories: infra
      - name: Open reviewed infrastructure release PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/pin-release "$GITHUB_SHA" "ghcr.io/collisionlab/osrs-coord-preview@$DIGEST"
